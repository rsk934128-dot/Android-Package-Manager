name: Build & Release Android APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Signed Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Configure Android SDK, Keystore, and Environment
        run: |
          # 1. Detect GitHub pre-installed Android SDK
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_DIR" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> $GITHUB_ENV
          echo "sdk.dir=$SDK_DIR" > local.properties
          
          # 2. Accept SDK licenses
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          if [ -x "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" --licenses 2>/dev/null || true
          fi
          
          # 3. Restore or Generate debug.keystore
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore 2>/dev/null || true
            echo "debug.keystore restored from base64."
          fi
          
          if [ ! -f debug.keystore ] || [ ! -s debug.keystore ]; then
            echo "Generating fresh debug.keystore via keytool..."
            keytool -genkey -v -keystore debug.keystore \
              -alias androiddebugkey -keyalg RSA -keysize 2048 \
              -validity 10000 -storepass android -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          
          # Copy to app directory as fallback
          cp debug.keystore app/debug.keystore
          
          # Verify keystore is valid
          keytool -list -keystore debug.keystore -storepass android -alias androiddebugkey
          echo "Keystore verified successfully."
          
          # 4. Create empty .env to satisfy Secrets plugin
          touch .env
          
          # 5. Make Gradle wrapper executable
          chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --no-configuration-cache --stacktrace -Dorg.gradle.jvmargs="-Xmx3g" -Dorg.gradle.workers.max=2

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AppPulse-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.0-build${{ github.run_number }}"
          name: "AppPulse Build #${{ github.run_number }}"
          draft: false
          prerelease: false
          body: |
            ### 🛡️ AppPulse Android APK
            **Commit:** `${{ github.sha }}`
            
            #### 📲 Download & Installation Instructions:
            1. Download the `app-debug.apk` asset below directly onto your Android device.
            2. Tap the file to install.
            3. If prompted by Android, enable *"Install Unknown Apps"* for your browser or file manager.
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
